<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To-Do DevOps</title>
<style>
  :root { --bg: #f4f6fb; --card: #fff; --text: #1f2937; --muted: #6b7280; --accent: #4f46e5; --accent-hover: #4338ca; --danger: #dc2626; --danger-hover: #b91c1c; --border: #e5e7eb; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, Segoe UI, sans-serif; background: var(--bg); color: var(--text); margin: 0; min-height: 100vh; display: flex; justify-content: center; padding: 48px 16px; }
  .app { width: 100%; max-width: 520px; background: var(--card); border-radius: 16px; padding: 28px; box-shadow: 0 10px 30px rgba(0,0,0,.08); }
  h1 { margin: 0 0 4px; font-size: 1.6rem; }
  .sub { margin: 0 0 20px; color: var(--muted); font-size: .95rem; }
  form { display: flex; gap: 10px; margin-bottom: 8px; }
  input { flex: 1; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; font-size: 1rem; }
  input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,70,229,.15); }
  button { padding: 10px 14px; border: none; border-radius: 10px; font-size: .95rem; cursor: pointer; color: #fff; background: var(--accent); }
  button:hover { background: var(--accent-hover); }
  #err { color: var(--danger); min-height: 1.2em; margin: 4px 0 12px; font-size: .9rem; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
  li:last-child { border-bottom: none; }
  li span { flex: 1; word-break: break-word; }
  .done span { text-decoration: line-through; color: var(--muted); }
  .actions { display: flex; gap: 8px; flex-shrink: 0; }
  .actions button { padding: 8px 10px; font-size: .85rem; }
  .btn-del { background: var(--danger); }
  .btn-del:hover { background: var(--danger-hover); }
  .empty { text-align: center; color: var(--muted); padding: 24px 0 8px; }
</style>
</head>
<body>
<div class="app">
  <h1>To-Do DevOps</h1>
  <p class="sub">Catat, selesaikan, dan kelola tugasmu.</p>
  <form id="f"><input id="t" placeholder="Tulis tugas baru..." maxlength="100"><button type="submit">Tambah</button></form>
  <p id="err"></p>
  <ul id="list"></ul>
</div>
<script>
const list = document.getElementById('list'), err = document.getElementById('err');
async function load() {
  const todos = await (await fetch('/api/todos')).json();
  list.innerHTML = '';
  if (!todos.length) { list.innerHTML = '<li class="empty">Belum ada tugas. Tambah yang pertama!</li>'; return; }
  todos.forEach(t => {
    const li = document.createElement('li');
    if (t.done) li.className = 'done';
    const s = document.createElement('span'); s.textContent = t.title;
    const box = document.createElement('div'); box.className = 'actions';
    const a = document.createElement('button'); a.textContent = t.done ? 'Batal' : 'Selesai';
    a.onclick = async () => { await fetch('/api/todos/' + t.id + '/toggle', {method:'PATCH'}); load(); };
    const d = document.createElement('button'); d.textContent = 'Hapus'; d.className = 'btn-del';
    d.onclick = async () => { await fetch('/api/todos/' + t.id, {method:'DELETE'}); load(); };
    box.append(a, d); li.append(s, box); list.append(li);
  });
}
document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  const r = await fetch('/api/todos', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({title: document.getElementById('t').value})});
  err.textContent = r.ok ? '' : (await r.json()).error;
  if (r.ok) document.getElementById('t').value = '';
  load();
};
load();
</script>
</body>
</html>
